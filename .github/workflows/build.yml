name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach builds to a GitHub Release on tags

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Stable signing key (see README). Without these secrets the APK is
      # signed with a throwaway debug key and Google Sign-In won't work.
      KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android lint (current Flutter/AGP) needs Java 21; 17 crashes with List.removeLast().
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/ if it isn't committed yet (flutter create never
      # overwrites lib/, test/ or pubspec.yaml) and sets the app name.
      - name: Prepare Android project
        run: bash tool/ci/prepare_platform.sh android

      # Flutter's template signs release builds with ~/.android/debug.keystore,
      # so we put our own key there (re-keyed to the debug alias/password).
      - name: Install signing key
        if: env.KS_BASE64 != ''
        run: |
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/release.jks" -srcstorepass "$KS_PASSWORD" \
            -srcalias "$KS_ALIAS" -srckeypass "$KS_PASSWORD" \
            -destkeystore ~/.android/debug.keystore -deststoretype PKCS12 \
            -deststorepass android -destkeypass android -destalias androiddebugkey
          rm -f "$RUNNER_TEMP/release.jks"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-1|SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-dodger-android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  ios:
    # Intel Mac runners: the default Apple-silicon pool (macos-latest) is often
    # out of capacity, which made the job fail with "not acquired by Runner".
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS project
        run: bash tool/ci/prepare_platform.sh ios

      - run: flutter pub get

      # Builds the iPhone app without signing (no Apple account needed).
      # The result proves the iOS build works and can be signed/sideloaded later.
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr sky_dodger-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sky-dodger-ios-unsigned
          path: build/ipa/sky_dodger-unsigned.ipa

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/sky_dodger-unsigned.ipa
